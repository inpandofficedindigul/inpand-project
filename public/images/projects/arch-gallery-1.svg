<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
    <defs>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#F9F9F8"/>
      </linearGradient>
    </defs>
    
    <!-- Outer Container -->
    <rect width="1200" height="750" fill="#E5E5E5" rx="12"/>
    <rect x="1" y="1" width="1198" height="748" fill="#FFFFFF" rx="11"/>

    <!-- Browser Bar -->
    <rect width="1200" height="48" fill="#F3F3F1" rx="11"/>
    <path d="M0 36H1200V48H0z" fill="#F3F3F1"/>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#E5E5E5" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="28" cy="24" r="6" fill="#FF5F56"/>
    <circle cx="48" cy="24" r="6" fill="#FFBD2E"/>
    <circle cx="68" cy="24" r="6" fill="#27C93F"/>

    <!-- URL Bar -->
    <rect x="120" y="12" width="480" height="24" rx="6" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <circle cx="136" cy="24" r="3" fill="#315EFB"/>
    <text x="148" y="28" font-family="'Inter', sans-serif" font-size="11" fill="#737373" font-weight="500">https://kanso-plans.com</text>

    <!-- Tag Indicator -->
    <rect x="1050" y="12" width="120" height="24" rx="4" fill="#315EFB15"/>
    <text x="1110" y="28" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#315EFB" text-anchor="middle">Static Website</text>

    <!-- Main Content Area -->
    <g transform="translate(0, 48)">
      
      <rect width="1200" height="702" fill="#FFFFFF"/>
      <text x="80" y="80" font-family="'Manrope', sans-serif" font-weight="700" font-size="28" fill="#171717">Technical Blueprint &bull; Level 2 Elevation</text>
      <rect x="80" y="120" width="1040" height="500" rx="8" fill="#F7F7F5" stroke="#E5E5E5"/>
      <line x1="120" y1="200" x2="1000" y2="200" stroke="#315EFB" stroke-dasharray="8 8"/>
      <line x1="120" y1="360" x2="1000" y2="360" stroke="#315EFB" stroke-dasharray="8 8"/>
      <text x="120" y="230" font-family="'Inter', sans-serif" font-size="12" fill="#315EFB">+12.400 ROOF LEVEL</text>
      <text x="120" y="390" font-family="'Inter', sans-serif" font-size="12" fill="#315EFB">+04.200 HABITABLE FLOOR</text>
    
