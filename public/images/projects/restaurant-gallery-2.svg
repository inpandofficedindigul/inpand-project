        <stop offset="100%" stop-color="#1C1C1E"/>
      </linearGradient>
    </defs>
    
    <!-- Outer Container -->
    <rect width="1200" height="750" fill="#2C2C2E" rx="12"/>
    <rect x="1" y="1" width="1198" height="748" fill="#121212" rx="11"/>

    <!-- Browser Bar -->
    <rect width="1200" height="48" fill="#1C1C1E" rx="11"/>
